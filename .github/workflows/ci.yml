# Executive summary: validate the research tools and pinned citation integration.
name: validation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned citation integration
        run: python -m pip install '.[citations]'
      - name: Validate research tools
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
