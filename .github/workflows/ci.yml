# Executive summary: validate the research tools and pinned citation integration.
name: validation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared validation dependencies
        run: python -m pip install '.[audit,citations,validation]'
      - name: Validate research tools
        env:
          PYTHONPATH: src:scripts
        # This one module replays ignored study data; run it with the prepared artifact locally.
        run: python -m pytest tests --ignore=tests/test_finance_adaptation.py
      - name: Verify public evidence and history
        run: python scripts/check_public_repository.py
      - name: Replay final scalar evidence
        env:
          PYTHONPATH: src
        run: python scripts/replay_grader_comparison.py
      - name: Replay independent financial source bank
        env:
          PYTHONPATH: src
        run: python scripts/replay_independent_finance.py
      - name: Replay final model extensions
        env:
          PYTHONPATH: src
        run: python scripts/replay_final_extensions.py
      - name: Check manuscript counts
        run: python scripts/check_voice_submission.py
