# Executive summary: installable Python CLI package with no third-party runtime dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthon-forecast-provenance-audit"
version = "0.1.0"
description = "Source-traced financial label audits and reproducible numerical grading comparisons"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["pandas==2.3.1", "pyarrow==21.0.0"]
figures = ["matplotlib>=3.8", "tueplots==0.2.4"]
learning = ["torch==2.10.0"]
citations = ["citeproof @ git+https://github.com/SebastianBoehler/citeproof.git@1fff12cca555e446ec0505ac9e4f924c0e6a55c9"]
validation = ["pytest==8.4.2", "gepa==0.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
