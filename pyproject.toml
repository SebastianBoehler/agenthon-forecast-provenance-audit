# Executive summary: installable Python CLI package with no third-party runtime dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthon-forecast-provenance-audit"
version = "0.1.0"
description = "Blinded packet preparation for a probabilistic finance forecast provenance study"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["pandas==2.3.1", "pyarrow==21.0.0"]
figures = ["matplotlib>=3.8", "tueplots==0.2.4"]
learning = ["numpy==2.4.3", "scipy==1.16.2", "torch==2.10.0"]
citations = ["citeproof @ git+https://github.com/SebastianBoehler/citeproof.git@1fff12cca555e446ec0505ac9e4f924c0e6a55c9"]

[project.scripts]
provenance-audit = "provenance_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
